<!-- @dsCard group="Colors" viewport="700x150" name="Syntax palette" subtitle="Code-block token colours" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:150px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="background:var(--surface-code);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:16px;font-family:var(--font-code);font-size:13px;line-height:1.65">
<div><span style="color:var(--syn-comment)">// keyword · string · number · function · comment</span></div>
<div><span style="color:var(--syn-keyword)">func</span> <span style="color:var(--syn-func)">render</span>(<span style="color:var(--syn-punct)">_</span> doc: <span style="color:var(--syn-keyword)">Document</span>) {</div>
<div>&nbsp;&nbsp;<span style="color:var(--syn-keyword)">let</span> width = <span style="color:var(--syn-number)">720</span>, title = <span style="color:var(--syn-string)">"Untitled.md"</span></div>
<div>}</div></div></body></html>
