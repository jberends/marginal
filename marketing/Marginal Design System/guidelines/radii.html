<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="4px chips · 10px cards · 20px screenshot frames" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:150px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:flex;gap:20px;align-items:flex-end">
<div><div style="width:110px;height:64px;border:1px solid var(--border-hairline);background:var(--surface-panel);border-radius:4px"></div><div class="n">4px · chips, inline code</div><div class="v">--radius-chip</div></div><div><div style="width:110px;height:64px;border:1px solid var(--border-hairline);background:var(--surface-panel);border-radius:6px"></div><div class="n">6px · buttons</div><div class="v">--radius-sm</div></div><div><div style="width:110px;height:64px;border:1px solid var(--border-hairline);background:var(--surface-panel);border-radius:10px"></div><div class="n">10px · cards, code blocks</div><div class="v">--radius-card</div></div><div><div style="width:110px;height:64px;border:1px solid var(--border-hairline);background:var(--surface-panel);border-radius:20px"></div><div class="n">20px · screenshots</div><div class="v">--radius-frame</div></div>
</div></body></html>
