<!-- @dsCard group="Colors" viewport="700x130" name="Dark mode" subtitle="Every token has a prefers-color-scheme counterpart" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:130px;overflow:hidden}
.g{display:flex;gap:12px}.sw{flex:1}.chip{height:56px;border-radius:6px;border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:#1E1E1D;"></div><div class="n">Page</div><div class="v">#1E1E1D</div></div>
<div class="sw"><div class="chip" style="background:#252524;"></div><div class="n">Panel</div><div class="v">#252524</div></div>
<div class="sw"><div class="chip" style="background:#33332F;"></div><div class="n">Hairline</div><div class="v">#33332F</div></div>
<div class="sw"><div class="chip" style="background:#E8E7E3;"></div><div class="n">Ink</div><div class="v">#E8E7E3</div></div>
<div class="sw"><div class="chip" style="background:#CB7DF7;"></div><div class="n">Violet</div><div class="v">#CB7DF7</div></div>
</div></body></html>
