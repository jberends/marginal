<!-- @dsCard group="Colors" viewport="700x130" name="Violet accent" subtitle="The single accent — high-chroma violet that pops off cream paper" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:130px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:#8E1FCB;"></div><div class="n">Violet</div><div class="v">#8E1FCB</div></div>
<div class="sw"><div class="chip" style="background:#7617A9;"></div><div class="n">Violet press</div><div class="v">#7617A9</div></div>
<div class="sw"><div class="chip" style="background:#F7EAFD;"></div><div class="n">Violet tint</div><div class="v">#F7EAFD</div></div>
<div class="sw" style="min-width:240px"><div class="chip" style="background:var(--surface-page);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--text-body)">Files stay&nbsp;<code style="background:var(--surface-code);color:var(--text-code);padding:1px 5px;border-radius:4px;border:1px solid var(--border-hairline);font-size:12px">plain .md</code></div><div class="n">In use</div><div class="v">--text-code</div></div>
<div class="sw" style="min-width:150px"><div class="chip" style="background:#8E1FCB;display:flex;align-items:center;justify-content:center;color:#FFFEFC;font-size:13px;font-weight:500">Download</div><div class="n">On paper</div><div class="v">--accent / --accent-on</div></div>
</div></body></html>
