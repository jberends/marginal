<!-- @dsCard group="Type" viewport="700x160" name="Syntax markers" subtitle="Markers are ink-40 and only visible on the cursor line" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:160px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:grid;gap:10px;font-size:20px;font-weight:600;color:var(--text-heading)">
<div><span style="color:var(--text-subtle);font-weight:400">## </span>Cursor is on this line</div>
<div>Marker hidden here</div>
<div style="font-size:16px;font-weight:400;color:var(--text-body)"><span style="color:var(--text-subtle)">**</span><strong style="font-weight:600">bold at the cursor</strong><span style="color:var(--text-subtle)">**</span> · <strong style="font-weight:600">bold elsewhere</strong></div>
<div style="font-size:11px;color:var(--text-subtle);font-weight:400">Fade 120ms, --ease-standard. Never slide, never reflow.</div>
</div></body></html>
