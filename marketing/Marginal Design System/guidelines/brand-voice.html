<!-- @dsCard group="Brand" viewport="700x180" name="Voice" subtitle="Quietly confident, typography-nerd, zero marketing fluff" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:180px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:grid;gap:14px;max-width:620px">
<div style="font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--text-heading)">Markdown that reads the way it renders.</div>
<div style="display:grid;gap:8px;font-size:13px">
<div style="color:var(--text-body)"><span style="color:var(--green);font-weight:600">Yes</span> &nbsp;“Files stay plain <code style="background:var(--surface-code);color:var(--text-code);padding:1px 4px;border-radius:4px">.md</code>. Works with git.”</div>
<div style="color:var(--text-muted)"><span style="color:var(--accent);font-weight:600">No</span> &nbsp;“Supercharge your writing workflow with AI-powered magic ✨”</div>
</div>
<div style="font-size:11px;color:var(--text-subtle)">Sentence case everywhere. Second person, sparingly. No emoji. State the fact, stop.</div>
</div></body></html>
