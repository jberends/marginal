<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:170px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:flex;gap:24px;padding:8px">
<div><div style="width:130px;height:70px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-card)"></div><div class="n">Card</div><div class="v">--shadow-card</div></div><div><div style="width:130px;height:70px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-raised)"></div><div class="n">Raised</div><div class="v">--shadow-raised</div></div><div><div style="width:130px;height:70px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-popover)"></div><div class="n">Popover</div><div class="v">--shadow-popover</div></div><div><div style="width:130px;height:70px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-frame)"></div><div class="n">Frame</div><div class="v">--shadow-frame</div></div>
</div></body></html>
