<!-- @dsCard group="Type" viewport="700x200" name="Heading scale" subtitle="30 / 24 / 20px — the app's own 1.875 / 1.5 / 1.25 steps, weight 600" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:200px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:grid;gap:12px">
<div class="row"><span style="font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--text-heading)">Heading one</span><span class="t">30px · 600 · --text-h1</span></div>
<div class="row"><span style="font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--text-heading)">Heading two</span><span class="t">24px · 600 · --text-h2</span></div>
<div class="row"><span style="font-size:20px;font-weight:600;color:var(--text-heading)">Heading three</span><span class="t">20px · 600 · --text-h3</span></div>
</div></body></html>
