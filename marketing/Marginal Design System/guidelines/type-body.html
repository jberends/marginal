<!-- @dsCard group="Type" viewport="700x180" name="Body & UI text" subtitle="16px/1.5 body, 14/13/12px UI steps" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:180px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:grid;gap:10px;max-width:600px">
<p style="font-size:16px;line-height:1.5;margin:0">Body — 16px, line height 1.5. The document column is capped at 720px so a line lands near 68 characters.</p>
<p style="font-size:14px;color:var(--text-muted);margin:0">Secondary — 14px, ink 60. Used for card body copy and captions.</p>
<p style="font-size:13px;color:var(--text-muted);margin:0">UI — 13px. Nav links, buttons, table cells.</p>
<p style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-subtle);margin:0">Eyebrow — 11px uppercase, .04em</p>
</div></body></html>
