<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="80–280ms, macOS easing, no bounce" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:150px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div style="display:grid;gap:8px;font-size:13px;color:var(--text-body)">
<div class="row"><span style="width:110px;font-weight:500">80ms</span><span class="t">--dur-instant · press feedback</span></div>
<div class="row"><span style="width:110px;font-weight:500">120ms</span><span class="t">--dur-fast · marker reveal, hover</span></div>
<div class="row"><span style="width:110px;font-weight:500">180ms</span><span class="t">--dur-base · buttons, chips</span></div>
<div class="row"><span style="width:110px;font-weight:500">280ms</span><span class="t">--dur-slow · panels, sheets</span></div>
<div class="row"><span style="width:110px;font-weight:500">easing</span><span class="t">cubic-bezier(.32,.72,0,1) · --ease-standard</span></div>
</div></body></html>
