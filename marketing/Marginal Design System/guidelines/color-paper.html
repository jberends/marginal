<!-- @dsCard group="Colors" viewport="700x130" name="Paper surfaces" subtitle="Warm off-white surfaces — never pure #FFF" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-ui);height:130px;overflow:hidden}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}
.n{font-size:11px;font-weight:500;color:var(--text-body);margin-top:8px}
.v{font-family:var(--font-code);font-size:10px;color:var(--text-subtle);margin-top:2px}
.t{font-family:var(--font-code);font-size:10px;color:var(--text-subtle)}
.row{display:flex;align-items:baseline;gap:16px}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:#FFFEFC;"></div><div class="n">Paper highlight</div><div class="v">#FFFEFC</div></div>
<div class="sw"><div class="chip" style="background:#F7F6F3;"></div><div class="n">Paper</div><div class="v">#F7F6F3</div></div>
<div class="sw"><div class="chip" style="background:#F1F0EC;"></div><div class="n">Paper sunk</div><div class="v">#F1F0EC</div></div>
<div class="sw"><div class="chip" style="background:#E9E9E7;"></div><div class="n">Margin rule</div><div class="v">#E9E9E7</div></div>
</div></body></html>
