<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body><div id="root"></div><script type="text/babel">
const NS=window.MarginalDesignSystem_dac766;

const {FeatureCard,CodeCard,ScreenshotFrame,Shortcut}=NS;
function Card(){return (<div style={{display:'grid',gap:20}}>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
    <FeatureCard glyph="##" title="Marks hide themselves" body="Syntax fades out as you type and returns only around the cursor."/>
    <FeatureCard glyph="⌘" title="Tabs, natively" body="Many documents, one window." shortcut={<Shortcut keys={['⌘','1']}/>} elevated/>
  </div>
  <CodeCard lang="markdown" lines={[
    [{t:'k',v:'## '},{v:'Release notes'}],
    [{v:''}],
    [{t:'p',v:'- '},{v:'Tabs land in 1.4'}],
    [{t:'c',v:'<!-- plain text, always -->'}]
  ]}/>
  <ScreenshotFrame caption="ScreenshotFrame · 20px radius">
    <div style={{height:90,background:'var(--surface-panel)'}}/>
  </ScreenshotFrame>
</div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
