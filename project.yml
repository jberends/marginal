name: Marginal
options:
  bundleIdPrefix: com.jochemberends
  deploymentTarget:
    macOS: "14.0"
attributes:
  # Matches the installed Xcode (26.6) so it stops offering "Update to recommended
  # settings" on every generated project.
  LastUpgradeCheck: "2660"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2ZP4KRYYZ5  # KE-works BV -- applies to app and test targets alike
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "9"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Marginal:
    type: application
    platform: macOS
    sources:
      - path: Sources/Marginal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jochemberends.marginal
        PRODUCT_NAME: Marginal
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Marginal/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Marginal/App/Marginal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MarginalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MarginalTests
    dependencies:
      - target: Marginal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Marginal:
    build:
      targets:
        Marginal: all
        MarginalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarginalTests
