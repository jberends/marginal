name: Marginal
options:
  bundleIdPrefix: com.jochemberends
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Marginal:
    type: application
    platform: macOS
    sources:
      - path: Sources/Marginal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jochemberends.marginal
        PRODUCT_NAME: Marginal
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Marginal/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Marginal/App/Marginal.entitlements
  MarginalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MarginalTests
    dependencies:
      - target: Marginal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Marginal:
    build:
      targets:
        Marginal: all
        MarginalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarginalTests
