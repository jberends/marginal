name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "marketing/**"
      - "assets/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run tests
        # The runner has no KE-works signing certificate; tests don't need one.
        run: |
          xcodebuild -project Marginal.xcodeproj -scheme Marginal \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test
